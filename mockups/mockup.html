<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
/* A：鼠尾草晨光 — 亞麻白、鼠尾草綠、俐落 */
.a {
  --bg: #F6F5F1; --card: #FFFFFF; --ink: #2E3430; --muted: #8E948F; --line: #E7E5DF;
  --accent: #6F8F7E; --soft: #EDF2EE; --c1: #C9A27E; --c2: #8AA0B4; --c3: #C7A96B; --c4: #8FA88F;
  --radius: 14px; --head: "Noto Serif TC", serif; --latin: "Cormorant Garamond", serif;
}
/* B：霧玫瑰 — 暖灰粉、玫瑰灰、雜誌感 */
.b {
  --bg: #F7F2F0; --card: #FFFCFB; --ink: #3A2E33; --muted: #9D8F94; --line: #EEE4E1;
  --accent: #A6707E; --soft: #F4E8EA; --c1: #C9908F; --c2: #9C93B5; --c3: #C8AE86; --c4: #8FA79B;
  --radius: 22px; --head: "Noto Serif TC", serif; --latin: "Cormorant Garamond", serif;
}
* { box-sizing: border-box; margin: 0; }
body { background: #E9E7E3; font-family: "Noto Sans TC", -apple-system, sans-serif; padding: 36px; display: flex; gap: 36px; }
body.b-page { background: #ECE6E4; }
.phone { width: 390px; height: 820px; background: var(--bg); color: var(--ink); border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(40,30,30,.14); padding: 46px 20px 0; font-size: 15px; line-height: 1.6; }
.eyebrow { font-family: var(--latin); letter-spacing: .22em; font-size: 13px; color: var(--muted); text-transform: uppercase; }
h1 { font-family: var(--head); font-weight: 500; font-size: 30px; letter-spacing: .04em; margin-top: 2px; }
h2 { font-family: var(--head); font-weight: 500; font-size: 17px; letter-spacing: .05em; }
.sub { color: var(--muted); font-size: 13px; }
.streak { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; color: var(--accent); }
.streak b { font-family: var(--latin); font-size: 19px; font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-top: 14px; }
.b .card { border: 0; box-shadow: 0 1px 0 rgba(0,0,0,.02), 0 8px 24px rgba(120,80,90,.06); }
.spread { display: flex; justify-content: space-between; align-items: center; }
.progress { height: 3px; background: var(--soft); border-radius: 9px; margin: 10px 0 6px; }
.progress i { display: block; height: 100%; width: 50%; background: var(--accent); border-radius: 9px; }
.item { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; }
.box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #CFCBC3; display: grid; place-items: center; flex: none; }
.b .box { border-radius: 50%; border-color: #DCCDCF; }
.item.done .box { background: var(--accent); border-color: var(--accent); }
.item.done .box::after { content: ""; width: 8px; height: 4px; border: 1.5px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.item.done .label { color: var(--muted); }
.item .sub { margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { font-size: 14px; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; background: var(--card); }
.chip i { width: 7px; height: 7px; border-radius: 50%; }
.chip.on { background: var(--soft); border-color: transparent; color: var(--accent); }
.b .chip.on { background: var(--accent); color: #fff; }
.b .chip.on i { background: #fff !important; }
.desc { margin-top: 12px; font-family: var(--head); font-size: 14px; color: #6B6560; padding: 2px 0 2px 12px; border-left: 2px solid var(--c1); }
.b .desc { border: 0; padding: 12px 14px; background: var(--soft); border-radius: 14px; color: #6E5A61; }
.ta { margin-top: 12px; height: 64px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 12px; color: #B5B0A9; font-size: 15px; }
.b .ta { border-radius: 16px; }
.row { display: flex; gap: 8px; margin-top: 12px; }
.btn { flex: 1; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 15px; font-weight: 500; letter-spacing: .06em; }
.b .btn { border-radius: 999px; }
.btn.primary { background: var(--ink); color: var(--bg); }
.b .btn.primary { background: var(--accent); color: #fff; }
.btn.ghost { border: 1px solid var(--line); color: var(--ink); flex: 0 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 6px; }
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 78px; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding-top: 10px; }
.b .tabs { border-top: 0; box-shadow: 0 -6px 20px rgba(120,80,90,.06); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.tab.on { color: var(--accent); }
.tab svg { width: 22px; height: 22px; }
.stats { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
.stats b { color: var(--ink); font-family: var(--latin); font-size: 17px; font-weight: 600; margin-right: 2px; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 182px; }
.grid span { font-size: 10px; color: var(--muted); text-align: center; }
.grid i { aspect-ratio: 1; border-radius: 4px; background: var(--soft); }
.b .grid i { border-radius: 50%; }
.grid i.on { background: var(--accent); }
.grid i.off { background: transparent; border: 1px dotted var(--line); }
.grid i.na { background: transparent; }
.tag { font-size: 12px; color: var(--muted); }
.addbtn { font-size: 14px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 4px 14px; }
.b .head-center { text-align: center; }
</style>
</head>
<body>
<script>
const theme = new URLSearchParams(location.search).get('t') || 'a';
document.body.classList.add(theme + '-page');
const I = {
  flame: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.5 3 3.5 4.5 3.5 8.5a3.5 3.5 0 0 1-7 0c0-1.5.6-2.6 1.5-3.5C10 10 9 12 9 13.5"/><path d="M12 21a6 6 0 0 0 6-6c0-4-3-6.5-6-12-3 5.5-6 8-6 12a6 6 0 0 0 6 6Z"/></svg>',
  mic: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Zm0 0A2 2 0 0 0 6 22h13"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>',
};
const tabs = on => `<div class="tabs">${[['pen','今天'],['book','回顧'],['check','清單'],['gear','設定']].map(([k,l]) => `<div class="tab ${l===on?'on':''}">${I[k]}${l}</div>`).join('')}</div>`;
const grid = pattern => '一二三四五六日'.split('').map(w => `<span>${w}</span>`).join('') + pattern.split('').map(c => `<i class="${{x:'on',o:'',d:'off',n:'na'}[c]}"></i>`).join('');

const today = `
<div class="phone ${theme}">
  <div class="${theme==='b'?'head-center':''}">
    <div class="eyebrow">Friday · Oct 23</div>
    <h1>10月23日</h1>
    <div class="streak">${I.flame} 已經連續寫了 <b>5</b> 天</div>
  </div>
  <div class="card">
    <div class="spread"><h2>今天要做的</h2><span class="sub">2 / 4</span></div>
    <div class="progress"><i></i></div>
    <div class="item done"><span class="box"></span><span class="label">喝 2000cc 的水</span></div>
    <div class="item done"><span class="box"></span><span class="label">早上冥想 10 分鐘</span></div>
    <div class="item"><span class="box"></span><span class="label">運動</span><span class="sub">本週 1/3</span></div>
    <div class="item"><span class="box"></span><span class="label">讀書會</span><span class="sub">每週五</span></div>
  </div>
  <div class="card">
    <h2>寫日記</h2>
    <div class="chips">
      <span class="chip on"><i style="background:var(--c1)"></i>感恩</span>
      <span class="chip"><i style="background:var(--c2)"></i>覺察</span>
      <span class="chip"><i style="background:var(--c3)"></i>發現幸福</span>
      <span class="chip"><i style="background:var(--c4)"></i>習慣</span>
    </div>
    <div class="desc">今天讓你覺得開心、想說謝謝的人事物有哪些？</div>
    <div class="ta">想到什麼就說什麼…</div>
    <div class="row"><span class="btn ghost">${I.mic} 說話</span><span class="btn primary">幫我整理</span></div>
  </div>
  ${tabs('今天')}
</div>`;

const habits = `
<div class="phone ${theme}">
  <div class="spread">
    <div><div class="eyebrow">Habits</div><h1>清單</h1></div>
    <span class="addbtn">＋ 新增</span>
  </div>
  <div class="card">
    <div class="spread"><div><h2>早上冥想 10 分鐘</h2><div class="tag">每天</div></div><span class="sub">編輯</span></div>
    <div class="stats"><span><b>86</b>% 完成率</span><span><b>6</b> 天連續</span><span><b>24</b> 天累計</span></div>
    <div class="grid">${grid('nnxxoxxxxxoxxxxxxxxxxoxxxxxxxxxxxo'.padEnd(35,'o'))}</div>
  </div>
  <div class="card">
    <div class="spread"><div><h2>運動</h2><div class="tag">每週 3 次</div></div><span class="sub">編輯</span></div>
    <div class="stats"><span>本週 <b>1/3</b></span><span><b>3</b> 週連續達標</span></div>
    <div class="grid">${grid('oxoxoxooxoxoxoxooooxoxooxoxoxooxooo')}</div>
  </div>
  ${tabs('清單')}
</div>`;

document.body.innerHTML = today + habits;
</script>
</body>
</html>
