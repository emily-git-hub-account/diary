<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日記">
<meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)" id="themeColor">
<meta name="theme-color" content="#1B1D1C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<script>try { var p = JSON.parse(localStorage.getItem('palette')); if (p) document.documentElement.dataset.palette = p; } catch (e) {}</script>
<style>
/* 版型固定，顏色可在設定換：sage 鼠尾草（預設）／rose 霧玫瑰／blue 霧藍／tea 奶茶 */
:root {
  --bg: #F6F5F1; --card: #FFFFFF; --ink: #2E3430; --muted: #8E948F; --line: #E7E5DF;
  --accent: #6F8F7E; --soft: #EDF2EE; --accent-d: #9DBBA9;
  --accent-ink: #FFFFFF;
  --danger: #B5574C;
  --box: color-mix(in srgb, var(--ink) 20%, var(--card));
  --serif: "Noto Serif TC", "Songti TC", serif;
  --latin: "Cormorant Garamond", "Noto Serif TC", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
:root[data-palette="rose"] { --bg: #F7F2F0; --ink: #3A2E33; --muted: #9D8F94; --line: #EEE4E1; --accent: #A6707E; --soft: #F4E8EA; --accent-d: #D3A1AE; }
:root[data-palette="blue"] { --bg: #F4F6F7; --ink: #2C333B; --muted: #8B939B; --line: #E3E7EA; --accent: #6B84A0; --soft: #E9EEF4; --accent-d: #9DB3CC; }
:root[data-palette="tea"]  { --bg: #F7F3EE; --ink: #3A322C; --muted: #9A8F85; --line: #EAE2D8; --accent: #A08268; --soft: #F1E9E0; --accent-d: #CDB096; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1D1C; --card: #242726; --ink: #E8E6E1; --muted: #9A9F9B; --line: #353937;
    --accent: var(--accent-d); --soft: color-mix(in srgb, var(--accent-d) 16%, #242726);
    --accent-ink: #1B1D1C; --danger: #E08A7F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1D1C; --card: #242726; --ink: #E8E6E1; --muted: #9A9F9B; --line: #353937;
  --accent: var(--accent-d); --soft: color-mix(in srgb, var(--accent-d) 16%, #242726);
  --accent-ink: #1B1D1C; --danger: #E08A7F; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans);
  font-size: 16px; line-height: 1.6; min-height: 100vh;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
svg.i { width: 16px; height: 16px; flex: none; }

/* 版面 */
.wrap { max-width: 640px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 20px 24px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 10px 0 20px; }
.eyebrow { font-family: var(--latin); font-weight: 500; letter-spacing: .22em; font-size: 13px; color: var(--muted); text-transform: uppercase; }
h1 { font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 1.3; margin: 2px 0 0; letter-spacing: .04em; }
h2 { font-family: var(--serif); font-weight: 500; font-size: 17px; margin: 0 0 12px; letter-spacing: .05em; }
.sub { color: var(--muted); font-size: 13px; }
.num { font-family: var(--latin); font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.row { display: flex; align-items: center; gap: 8px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stack > * + * { margin-top: 10px; }

/* 按鈕 */
.btn { border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 500; letter-spacing: .04em; background: var(--soft); color: var(--ink); min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn.small { padding: 5px 14px; min-height: 34px; font-size: 14px; border-radius: 10px; }
.btn.outline.small { border-radius: 999px; }
.btn:disabled { opacity: .5; }
.btn.block { width: 100%; }
.icon-btn { border: 0; background: transparent; padding: 8px; border-radius: 10px; color: var(--muted); min-width: 40px; min-height: 40px; font-size: 14px; }
.icon-btn:active { background: var(--soft); }

/* 輸入 */
textarea, input[type=text], input[type=password], input[type=date] {
  width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  padding: 12px 14px; font-size: 17px; outline: none;
}
textarea { min-height: 140px; resize: vertical; line-height: 1.75; }
textarea:focus, input:focus { border-color: var(--accent); }
::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
label.field { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; letter-spacing: .04em; }

/* 分類標籤 */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 15px; font-size: 15px; min-height: 38px; display: inline-flex; align-items: center; gap: 7px; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.chip.on { border-color: transparent; background: var(--soft); color: var(--accent); font-weight: 500; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.tag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

/* 日記卡片 */
.entry { border-top: 1px solid var(--line); padding: 14px 0 8px; }
.entry:first-child { border-top: 0; padding-top: 2px; }
.entry-body { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; line-height: 1.8; }
.entry-actions { display: flex; gap: 2px; margin-top: 2px; justify-content: flex-end; }
.day-head { font-family: var(--serif); font-weight: 500; font-size: 16px; margin: 24px 0 8px; display: flex; align-items: baseline; gap: 8px; letter-spacing: .04em; }
.day-head .sub { font-family: var(--sans); }
.empty { color: var(--muted); text-align: center; padding: 22px 8px; font-size: 15px; }

/* 寫日記 */
.hint { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; }
.raw-peek { font-size: 14px; color: var(--muted); white-space: pre-wrap; background: var(--soft); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
.btn.rec { background: color-mix(in srgb, var(--danger) 10%, var(--card)); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); }
.rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.interim { color: var(--muted); font-size: 15px; margin-top: 6px; }
.cat-desc { margin-top: 12px; padding: 2px 0 2px 12px; border-left: 2px solid var(--c); font-family: var(--serif); font-size: 15px; color: color-mix(in srgb, var(--ink) 72%, var(--card)); }
.summary-body { white-space: pre-wrap; word-break: break-word; line-height: 1.9; font-family: var(--serif); }
.summary-h { display: block; font-family: var(--serif); font-weight: 500; color: var(--accent); margin-top: 14px; letter-spacing: .06em; font-size: 14px; }
.summary-h:first-child { margin-top: 4px; }
.summary-card { border-left: 2px solid var(--accent); }
.streak { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: var(--accent); letter-spacing: .04em; }
.streak.pending { color: var(--muted); }
.streak b { font-family: var(--latin); font-weight: 600; font-size: 19px; line-height: 1; }
.bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
.bar-row { display: grid; grid-template-columns: 6.5em 1fr 2em; align-items: center; gap: 10px; }
.bar-row b { text-align: right; font-family: var(--latin); font-weight: 600; font-size: 17px; }
.bar { height: 4px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; min-width: 2px; }
.hist-row { width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; display: flex; justify-content: space-between; align-items: center; padding: 12px 0; min-height: 48px; text-align: left; }
.hist-row:first-child { border-top: 0; }
details summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 0; }

/* 打卡 */
.check-list { display: flex; flex-direction: column; }
.check { display: flex; align-items: center; gap: 12px; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; width: 100%; min-height: 48px; }
.check:first-child { border-top: 0; }
.check .box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--box); display: grid; place-items: center; flex: none; transition: all .15s; }
.check.done .box { background: var(--accent); border-color: var(--accent); }
.check.done .box::after { content: ""; width: 8px; height: 4px; border: 1.5px solid var(--accent-ink); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.check.done .label { color: var(--muted); }
.progress { height: 3px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

/* 習慣 */
.habit-name { font-family: var(--serif); font-weight: 500; font-size: 17px; letter-spacing: .04em; }
.habit-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); align-items: baseline; }
.habit-stats b { color: var(--ink); font-family: var(--latin); font-weight: 600; font-size: 18px; margin-right: 2px; }
.habit-card .habit-stats { margin: 8px 0 12px; }
.hgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 200px; }
.hgrid .wd { font-size: 10px; color: var(--muted); text-align: center; }
.hgrid i { aspect-ratio: 1; border-radius: 4px; background: var(--soft); }
.hgrid i[data-d] { cursor: pointer; }
.hgrid i.on { background: var(--accent); }
.hgrid i.off { background: transparent; border: 1px dotted var(--line); }
.hgrid i.na { background: transparent; }
.hgrid i.future { background: transparent; border: 1px dashed var(--line); }
.hgrid i.today { outline: 1.5px solid var(--ink); outline-offset: 1px; }

/* 回顧 */
.seg { display: flex; background: var(--soft); border-radius: 12px; padding: 3px; margin-bottom: 16px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 7px; font-weight: 500; color: var(--muted); min-height: 38px; letter-spacing: .04em; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .wd { font-size: 11px; color: var(--muted); padding-bottom: 4px; }
.cal button { border: 0; background: transparent; border-radius: 50%; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--latin); font-weight: 600; font-size: 17px; padding: 0; min-height: 40px; }
.cal button.sel { background: var(--accent); color: var(--accent-ink); }
.cal button.is-today:not(.sel) { color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal .mini { display: flex; gap: 2px; height: 4px; }
.cal .mini i { width: 4px; height: 4px; border-radius: 50%; background: var(--c); }
.cal button.sel .mini i { background: var(--accent-ink); }

/* 設定 */
.cat-item { padding: 12px 0; border-top: 1px solid var(--line); }
.cat-item:first-child { border-top: 0; }
.cat-item textarea { min-height: 0; margin-top: 8px; padding: 8px 10px; font-size: 15px; }
.cat-row { display: flex; align-items: center; gap: 8px; }
.cat-row input[type=text] { padding: 8px 10px; font-size: 16px; }
.cat-row input[type=color] { width: 32px; height: 32px; border: 0; padding: 0; background: none; border-radius: 50%; flex: none; }
.cat-item.off input[type=text] { color: var(--muted); text-decoration: line-through; }
.palettes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.palette { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.palette .sw { width: 30px; height: 30px; border-radius: 50%; background: var(--sw); box-shadow: inset 0 0 0 5px var(--swbg); }
.palette.on { border-color: var(--ink); color: var(--ink); }

/* 底部分頁 */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs .in { display: flex; max-width: 640px; width: 100%; }
nav.tabs button { flex: 1; border: 0; background: transparent; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; letter-spacing: .08em; color: var(--muted); min-height: 60px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button.on { color: var(--accent); }

/* 登入 */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 20px; }
.login .card { width: 100%; max-width: 360px; text-align: center; padding: 32px 22px; }

/* 提示訊息 */
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 14px; letter-spacing: .04em; opacity: 0; transition: all .25s; z-index: 50; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.spin { width: 16px; height: 16px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-page { text-align: center; color: var(--muted); padding: 40px 0; }

/* 彈窗 */
.sheet-bg { position: fixed; inset: 0; background: rgba(20,20,20,.3); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 640px; border-radius: 20px 20px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 20px; } }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <div class="card stack">
    <div class="eyebrow">Journal</div>
    <h1 style="margin-bottom:6px">我的日記</h1>
    <p class="sub" style="margin:0">請輸入密碼</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="密碼">
    <button id="loginBtn" class="btn primary block">進入</button>
    <p id="loginErr" class="sub" style="color:var(--danger);margin:0"></p>
  </div>
</div>

<div id="app" class="hidden">
  <main class="wrap" id="view"></main>
  <nav class="tabs"><div class="in">
    <button data-tab="today" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>今天</button>
    <button data-tab="review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Zm0 0A2 2 0 0 0 6 22h13"/><path d="M9 7h6M9 11h4"/></svg>回顧</button>
    <button data-tab="habits">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="m8 13 3 3 5-6"/></svg>清單</button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>設定</button>
  </div></nav>
</div>

<div id="toast" class="toast"></div>

<script>
// 後端網址（Apps Script 網頁應用程式）。這不是秘密，真正的保護是密碼。
const API_URL = 'https://script.google.com/macros/s/AKfycbxXSQWkDSegS3QCSh50-WP7I8nixUKfDKMEjsskvYDowQQOlX689Atvmq7kmDfn26Cq/exec';

// ───────── 共用 ─────────
const svg = d => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  flame: svg('<path d="M12 21a6 6 0 0 0 6-6c0-4-3-6.5-6-12-3 5.5-6 8-6 12a6 6 0 0 0 6 6Z"/><path d="M12 21a2.5 2.5 0 0 1-2.5-2.5c0-1.7 1.2-2.6 2.5-4.5 1.3 1.9 2.5 2.8 2.5 4.5A2.5 2.5 0 0 1 12 21Z"/>'),
  mic: svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'),
};
const EN_WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const EN_MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const pageHead = (eyebrow, title, right = '') => `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div>${right}</div>`;

// 配色（只換顏色，版型不變）
const PALETTES = [
  { id: 'sage', name: '鼠尾草', accent: '#6F8F7E', bg: '#F6F5F1' },
  { id: 'rose', name: '霧玫瑰', accent: '#A6707E', bg: '#F7F2F0' },
  { id: 'blue', name: '霧藍', accent: '#6B84A0', bg: '#F4F6F7' },
  { id: 'tea', name: '奶茶', accent: '#A08268', bg: '#F7F3EE' },
];
function applyPalette(id) {
  const p = PALETTES.find(x => x.id === id) || PALETTES[0];
  document.documentElement.dataset.palette = p.id;
  $('#themeColor').setAttribute('content', p.bg);
}
// 舊版預設分類顏色換成柔和版（存檔後就會寫回試算表）
const SOFTEN = { '#C8794F': '#C9A27E', '#6F8FAF': '#8AA0B4', '#D4A23C': '#C7A96B', '#6E9A78': '#8FA88F' };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const prettyDate = s => { const d = parse(s); return `${d.getMonth() + 1}月${d.getDate()}日 星期${WD[d.getDay()]}`; };
const monthOf = s => s.slice(0, 7);
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

async function api(action, payload = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, password: state.password, ...payload }),
  });
  const j = await res.json();
  if (!j.ok) {
    if (/未知的動作/.test(j.error)) throw new Error('後端還沒更新，請先部署新版本');
    if (j.auth && action !== 'login') logout(j.error);
    throw new Error(j.error || '發生錯誤');
  }
  return j.data;
}

async function busy(btn, fn) {
  const html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try { return await fn(); }
  catch (e) { toast(e.message.includes('fetch') ? '網路連線失敗，請稍後再試' : e.message); }
  finally { btn.disabled = false; btn.innerHTML = html; }
}

  tab: 'today',
  categories: [],
  habits: null,      // 後端還沒更新時是 null
  months: {},        // 'YYYY-MM' → entries
  summaries: {},     // 'YYYY-MM' → { date: summary }
  habitChecks: {},   // habitId → Set(dates)
  date: today(),
  draft: store.get('draft', null) || { date: today(), categoryId: '', raw: '', polished: '', id: '' },
  review: { mode: 'date', month: monthOf(today()), day: '', categoryId: '' },

const activeCats = () => state.categories.filter(c => c.active);
const saveDraft = () => store.set('draft', state.draft);

async function loadMonth(ym, force) {
  if (state.months[ym] && !force) return state.months[ym];
  const list = await api('getEntries', { from: ym + '-01', to: ym + '-31' });
  state.months[ym] = list;
  return list;
}
async function loadSummaries(ym) {
  if (state.summaries[ym]) return state.summaries[ym];
  const map = {};
  try { (await api('getSummaries', { from: ym + '-01', to: ym + '-31' })).forEach(x => map[x.date] = x); }
  catch (e) { if (!/部署新版本/.test(e.message)) throw e; }  // 後端還沒部署新版時當作沒有
  return (state.summaries[ym] = map);
}
// ───────── 登入 ─────────
function logout(msg) {
  state.password = ''; store.del('pw');
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#loginErr').textContent = msg || '';
}
$('#loginBtn').onclick = () => busy($('#loginBtn'), async () => {
  state.password = $('#pw').value.trim();

  catch (e) { $('#loginErr').textContent = e.message.includes('fetch') ? '網路連線失敗，請稍後再試' : e.message; return; }
  store.set('pw', state.password); $('#pw').value = '';
  await start();
});

async function start() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');

    $('#view').innerHTML = `<div class="empty">載入失敗：${esc(e.message)}<br><br><button class="btn" onclick="start()">再試一次</button></div>`;

function streakHtml() {
  if (!state.entryDates) return '';
  const t = today();
  const done = state.entryDates.has(t);
  let n = 0, d = done ? t : addDays(t, -1);
  while (state.entryDates.has(d)) { n++; d = addDays(d, -1); }
  const text = !n ? '寫下第一則，開始累積連續天數'
    : done ? `${ICON.flame} 已經連續寫了 <b>${n}</b> 天`
    : `${ICON.flame} 連續 <b>${n}</b> 天・今天寫一則就能接上`;
  return `<div class="streak ${n && !done ? 'pending' : ''}">${text}</div>`;
}

// ───────── 語音輸入（瀏覽器內建辨識）─────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;

function startRec() {
  const r = new SR();
  r.lang = 'zh-TW';
  r.continuous = true;
  r.interimResults = true;
  r.keep = true;  // 瀏覽器停頓一下就會自己結束，錄音中就自動接著錄
  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) appendRaw(t); else interim += t;
    }
    if ($('#interim')) $('#interim').textContent = interim;
  };
  r.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    r.keep = false;
    toast(e.error === 'not-allowed' || e.error === 'service-not-allowed'
      ? '沒有麥克風權限，請在瀏覽器允許，或改用鍵盤上的麥克風'
      : '錄音中斷了，請再按一次「開始說話」');
  };
  r.onend = () => {
    if (r.keep && rec === r) { try { r.start(); return; } catch (err) {} }
    if (rec === r) rec = null;
    updateMicUI();
  };
  try { r.start(); } catch (err) { return toast('這個瀏覽器沒辦法錄音，請改用鍵盤上的麥克風'); }
  rec = r;
  updateMicUI();
}

function stopRec() {
  if (!rec) return;
  const r = rec;
  r.keep = false;
  rec = null;
  r.stop();
  updateMicUI();
}

function appendRaw(t) {
  const d = state.draft;
  d.raw = (d.raw || '').replace(/\s+$/, '') + t.trim();
  saveDraft();
  const ta = $('#raw');
  if (ta) { ta.value = d.raw; ta.scrollTop = ta.scrollHeight; }
}

function updateMicUI() {
  const b = $('#micBtn');
  if ($('#interim') && !rec) $('#interim').textContent = '';
  if (!b) return;
  b.classList.toggle('rec', !!rec);
  b.innerHTML = rec ? '<span class="rec-dot"></span> 停止' : `${ICON.mic} 說話`;
}

// 每日總結
const summaryHtml = s => `<div class="summary-body">${esc(s.content)
  .trim().replace(/\n*【(.+?)】\n?/g, '<b class="summary-h">$1</b>')}</div>`;

async function renderSummary() {
  const box = $('#summaryCard');
  const date = state.date;
  const label = date === today() ? '今天' : '這天';
  let s = null;
  try { s = (await loadSummaries(monthOf(date)))[date]; } catch (e) {}
  if (state.tab !== 'today' || date !== state.date || !box.isConnected) return;
  box.innerHTML = s ? `
    <div class="spread"><h2 style="margin:0">${label}的總結</h2><button class="btn small ghost" id="sumBtn">重新整理</button></div>
    ${summaryHtml(s)}` : `
    <h2>${label}的總結</h2>
    <p class="sub" style="margin:-4px 0 12px">寫完日記、打完卡之後，讓 Claude 幫你回顧${label}，再送你一段話。</p>
    <button class="btn outline block" id="sumBtn">幫我整理${label}</button>`;
  $('#sumBtn').onclick = e => busy(e.currentTarget, async () => {
    const res = await api('summarizeDay', { date });
    (state.summaries[monthOf(date)] = state.summaries[monthOf(date)] || {})[date] = res;
    renderSummary();
  });
}

async function saveEntry(content, raw) {
  const d = state.draft;
  if (!content) return toast('內容是空的');
  if (!d.categoryId) return toast('請先選分類');
  const cat = catById(d.categoryId);
  await api('saveEntry', { entry: { id: d.id, date: d.date, categoryId: d.categoryId, categoryName: cat.name, content, raw } });
  delete state.months[monthOf(d.date)];
  if (state.entryDates) state.entryDates.add(d.date);
  state.byCat = {};
  toast(d.id ? '已更新 ✓' : '已儲存 ✓');
  resetDraft();
  renderToday();
}

async function renderDayEntries() {
  const box = $('#dayEntries');
  try {
    const date = state.date;
    const list = (await loadMonth(monthOf(date))).filter(e => e.date === date);
    if (state.tab !== 'today' || date !== state.date) return;
    box.innerHTML = list.length ? list.map(entryHtml).join('') : '<div class="empty">還沒有內容，寫下第一則吧</div>';
    bindEntryActions(box, list, () => renderDayEntries());
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function entryHtml(e, showDate) {
  const c = catById(e.categoryId);
  return `<article class="entry" data-id="${e.id}">
    <div class="spread"><span class="tag" style="--c:${c.color}"><span class="dot"></span>${esc(c.name)}</span>
      ${showDate ? `<span class="sub">${prettyDate(e.date)}</span>` : ''}</div>
    <p class="entry-body">${esc(e.content)}</p>
    <div class="entry-actions">
      <button class="icon-btn" data-act="edit" aria-label="修改">修改</button>
      <button class="icon-btn" data-act="del" aria-label="刪除">刪除</button>
    </div>
  </article>`;
}

function bindEntryActions(box, list, refresh) {
  box.onclick = async ev => {
    const btn = ev.target.closest('[data-act]'); if (!btn) return;
    const e = list.find(x => x.id === btn.closest('.entry').dataset.id); if (!e) return;
    if (btn.dataset.act === 'edit') {
      state.date = e.date;
      state.draft = { id: e.id, date: e.date, categoryId: e.categoryId, raw: e.raw || e.content, polished: e.content };
      saveDraft();
      state.tab = 'today';
      document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'today'));
      renderToday(); window.scrollTo(0, 0);
    } else if (confirm('確定要刪除這則日記嗎？刪除後無法復原。')) {
      await busy(btn, async () => {
        await api('deleteEntry', { id: e.id });
        delete state.months[monthOf(e.date)]; state.byCat = {};
        const left = await loadMonth(monthOf(e.date));
        if (state.entryDates && !left.some(x => x.date === e.date)) state.entryDates.delete(e.date);
        if ($('.streak')) $('.streak').outerHTML = streakHtml();
        toast('已刪除'); refresh();
      });
    }
  };
}

async function renderByDate() {
  const r = state.review;
  const body = $('#reviewBody');
  const [y, m] = r.month.split('-').map(Number);
  body.innerHTML = `
    <section class="card">
      <div class="spread" style="margin-bottom:10px">
        <button class="icon-btn" id="prevM" aria-label="上個月">‹</button>
        <h2 style="margin:0">${y} 年 ${m} 月</h2>
        <button class="icon-btn" id="nextM" aria-label="下個月" ${r.month >= monthOf(today()) ? 'disabled' : ''}>›</button>
      </div>
      <div id="calBox"><div class="loading-page"><span class="spin"></span></div></div>
    </section>
    <div id="monthList"></div>`;
  const shift = n => { const d = new Date(y, m - 1 + n, 1); r.month = ymd(d).slice(0, 7); r.day = ''; renderByDate(); };
  $('#prevM').onclick = () => shift(-1);
  $('#nextM').onclick = () => shift(1);

  let list, sums;
  try { [list, sums] = await Promise.all([loadMonth(r.month), loadSummaries(r.month)]); } catch (e) { $('#calBox').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (state.tab !== 'review' || r.mode !== 'date' || r.month !== `${y}-${pad(m)}`) return;

  const byDay = {};
  list.forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));
  const first = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  let cells = WD.map(w => `<div class="wd">${w}</div>`).join('') + '<div></div>'.repeat(first);
  for (let i = 1; i <= days; i++) {
    const ds = `${r.month}-${pad(i)}`;
    const cats = [...new Set((byDay[ds] || []).map(e => e.categoryId))].slice(0, 4);
    cells += `<button data-day="${ds}" class="${ds === r.day ? 'sel' : ''} ${ds === today() ? 'is-today' : ''}">${i}
      <span class="mini">${cats.map(c => `<i style="--c:${catById(c).color}"></i>`).join('')}</span></button>`;
  }
  $('#calBox').innerHTML = `<div class="cal">${cells}</div>`;
  $('#calBox').onclick = ev => {
    const b = ev.target.closest('[data-day]'); if (!b) return;
    r.day = r.day === b.dataset.day ? '' : b.dataset.day; renderByDate();
  };

  const dates = Object.keys(byDay).filter(d => !r.day || d === r.day).sort().reverse();
  const ml = $('#monthList');
  if (!dates.length) {
    ml.innerHTML = `<div class="empty">${r.day ? '這天沒有日記' : '這個月還沒有日記'}</div>`;
    return;
  }
  ml.innerHTML = (r.day ? `<div class="spread"><span></span><button class="btn small ghost" id="allMonth">看整個月</button></div>` : '') +
    dates.map(ds => `<div class="day-head">${prettyDate(ds)}<span class="sub">${byDay[ds].length} 則</span></div>
      ${sums[ds] ? `<section class="card summary-card">${summaryHtml(sums[ds])}</section>` : ''}
      <section class="card" style="padding-top:12px;padding-bottom:6px">${byDay[ds].map(e => entryHtml(e)).join('')}</section>`).join('');
  if ($('#allMonth')) $('#allMonth').onclick = () => { r.day = ''; renderByDate(); };
  bindEntryActions(ml, list, () => renderByDate());
}

async function renderByCat() {
  const r = state.review;
  if (!r.categoryId || !state.categories.some(c => c.id === r.categoryId)) r.categoryId = state.categories[0]?.id || '';
  const body = $('#reviewBody');
  body.innerHTML = `
    <div class="chips" id="revCats" style="margin-bottom:16px">${state.categories.map(c => `
      <button class="chip ${c.id === r.categoryId ? 'on' : ''}" data-id="${c.id}" style="--c:${c.color}"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')}</div>
    <div id="catList"><div class="loading-page"><span class="spin"></span></div></div>`;
  $('#revCats').onclick = e => { const b = e.target.closest('.chip'); if (b) { r.categoryId = b.dataset.id; renderByCat(); } };

  const cid = r.categoryId;
  state.byCat = state.byCat || {};
  let list;
  try { list = state.byCat[cid] || (state.byCat[cid] = await api('getEntriesByCategory', { categoryId: cid })); }
  catch (e) { $('#catList').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (state.tab !== 'review' || r.mode !== 'cat' || r.categoryId !== cid) return;
  list = [...list].sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));

    : '<div class="empty">這個分類還沒有日記</div>';
  bindEntryActions(box, list, () => { delete state.byCat[cid]; renderByCat(); });
}

// AI 回顧一段時間
const fmtDate = s => s.replace(/-/g, '/');
function periodPresets() {
  const t = today();
  const first = t.slice(0, 8) + '01';
  const lastMonthEnd = addDays(first, -1);
  return [
    { label: '最近 7 天', from: addDays(t, -6), to: t },
    { label: '最近 30 天', from: addDays(t, -29), to: t },
    { label: '這個月', from: first, to: t },
    { label: '上個月', from: lastMonthEnd.slice(0, 8) + '01', to: lastMonthEnd },
  ];
}

function periodHtml(p) {
  const st = p.stats || { total: 0, days: 0, categories: [] };
  const max = Math.max(1, ...st.categories.map(c => c.count));
  return `<section class="card summary-card">
    <h2 style="margin-bottom:4px">${fmtDate(p.from)} – ${fmtDate(p.to)}</h2>
    <p class="sub" style="margin:0 0 12px">共 <b>${st.total}</b> 則・寫了 <b>${st.days}</b> 天</p>
    <div class="bars">${st.categories.map(c => `
      <div class="bar-row"><span class="tag" style="--c:${c.color}"><span class="dot"></span>${esc(c.name)}</span>
        <span class="bar"><i style="width:${c.count / max * 100}%;background:${c.color}"></i></span><b>${c.count}</b></div>`).join('')}
    </div>
    <b class="summary-h">給你的話</b>
    <div class="summary-body">${esc(p.content.trim())}</div>
  </section>`;
}

async function renderPeriod() {
  const r = state.review;
  const presets = periodPresets();
  if (!r.from) { r.from = presets[0].from; r.to = presets[0].to; }
  $('#reviewBody').innerHTML = `
    <section class="card stack">
      <h2 style="margin:0">回顧一段時間</h2>
      <div class="chips" id="presets">${presets.map((p, i) => `
        <button class="chip ${p.from === r.from && p.to === r.to ? 'on' : ''}" data-i="${i}">${p.label}</button>`).join('')}</div>
      <div class="row">
        <div style="flex:1"><label class="field">從</label><input type="date" id="pFrom" value="${r.from}" max="${today()}"></div>
        <div style="flex:1"><label class="field">到</label><input type="date" id="pTo" value="${r.to}" max="${today()}"></div>
      </div>
      <button class="btn primary block" id="periodBtn">幫我回顧這段時間</button>
    </section>
    <div id="periodResult">${r.result ? periodHtml(r.result) : ''}</div>
    <div id="periodHistory"></div>`;
  $('#presets').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const p = presets[b.dataset.i]; r.from = p.from; r.to = p.to; renderPeriod();
  };
  $('#pFrom').onchange = e => { r.from = e.target.value; };
  $('#pTo').onchange = e => { r.to = e.target.value; };
  $('#periodBtn').onclick = e => busy(e.currentTarget, async () => {
    if (!r.from || !r.to || r.to < r.from) return toast('「到」要在「從」之後');
    r.result = await api('summarizePeriod', { from: r.from, to: r.to });
    if (state.periodHistory) state.periodHistory.unshift(r.result);
    renderPeriod();
  });

  try { state.periodHistory = state.periodHistory || await api('getPeriodSummaries'); }
  catch (err) { return; }
  if (state.tab !== 'review' || r.mode !== 'ai') return;
  const hist = state.periodHistory.filter(p => p !== r.result);
  if (!hist.length) return;
  $('#periodHistory').innerHTML = `<h2 style="margin-top:24px">過去的回顧</h2>
    <section class="card" style="padding:6px 18px">${hist.map((p, i) => `
      <button class="hist-row" data-i="${i}"><span>${fmtDate(p.from)} – ${fmtDate(p.to)}</span><span class="sub">${p.stats ? p.stats.total + ' 則' : ''} ›</span></button>`).join('')}
    </section>`;
  $('#periodHistory').onclick = e => {
    const b = e.target.closest('.hist-row'); if (!b) return;
    r.result = hist[b.dataset.i]; r.from = r.result.from; r.to = r.result.to;
    renderPeriod(); $('#periodResult').scrollIntoView({ behavior: 'smooth' });
  };
}

// ───────── 清單（每一項有自己的頻率）─────────
const WD_MON = [1, 2, 3, 4, 5, 6, 0];   // 星期一開頭
const weekStartOf = s => addDays(s, -((parse(s).getDay() + 6) % 7));
const doneOn = (h, d) => !!(state.habitChecks[h.id] && state.habitChecks[h.id].has(d));
const isDueOn = (h, d) => h.freq !== 'weekdays' || h.days.includes(parse(d).getDay());
const weekCount = (h, d) => { const ws = weekStartOf(d); let n = 0; for (let i = 0; i < 7; i++) if (doneOn(h, addDays(ws, i))) n++; return n; };
const freqLabel = h => h.freq === 'weekdays' ? '每週' + WD_MON.filter(x => h.days.includes(x)).map(x => WD[x]).join('、')
  : h.freq === 'weekly' ? `每週 ${h.times} 次` : '每天';
const habitsOn = d => (state.habits || []).filter(h => h.active && h.start <= d && isDueOn(h, d));

async function toggleHabit(h, d, redraw) {
  const set = state.habitChecks[h.id] = state.habitChecks[h.id] || new Set();
  const done = !set.has(d);
  done ? set.add(d) : set.delete(d);
  redraw();
  try { await api('setHabitCheck', { date: d, habitId: h.id, done }); }
  catch (e) { done ? set.delete(d) : set.add(d); redraw(); toast('沒存到，請再按一次'); }
}

function habitStats(h) {
  const t = today();
  if (h.start > t) return `<span>${fmtDate(h.start)} 開始</span>`;
  const done = d => doneOn(h, d);
  if (h.freq === 'weekly') {
    const firstWeek = weekStartOf(h.start);
    let streak = weekCount(h, t) >= h.times ? 1 : 0;
    for (let w = addDays(weekStartOf(t), -7); w >= firstWeek && weekCount(h, w) >= h.times; w = addDays(w, -7)) streak++;
    const total = [...(state.habitChecks[h.id] || [])].filter(d => d >= h.start && d <= t).length;
    return `<span>本週 <b>${weekCount(h, t)}/${h.times}</b></span><span>連續達標 <b>${streak}</b> 週</span><span>累計 <b>${total}</b> 次</span>`;
  }
  const due = [];
  for (let d = h.start; d <= t; d = addDays(d, 1)) if (isDueOn(h, d)) due.push(d);
  const count = due.filter(done).length;
  let streak = 0, i = due.length - 1;
  if (i >= 0 && due[i] === t && !done(t)) i--;   // 今天還沒做不算斷
  while (i >= 0 && done(due[i])) { streak++; i--; }
  const rate = due.length ? Math.round(count / due.length * 100) : 0;
  return `<span>完成率 <b>${rate}%</b></span><span>連續 <b>${streak}</b> ${h.freq === 'daily' ? '天' : '次'}</span><span>累計 <b>${count}</b> ${h.freq === 'daily' ? '天' : '次'}</span>`;
}

function habitGrid(h) {
  const t = today();
  const from = addDays(weekStartOf(t), -28);
  let cells = WD_MON.map(x => `<span class="wd">${WD[x]}</span>`).join('');
  for (let i = 0; i < 35; i++) {
    const d = addDays(from, i);
    const cls = d > t ? 'future' : d < h.start ? 'na' : doneOn(h, d) ? 'on' : isDueOn(h, d) ? '' : 'off';
    const tappable = d <= t && d >= h.start;
    cells += `<i class="${cls} ${d === t ? 'today' : ''}" ${tappable ? `data-d="${d}"` : ''} title="${d}"></i>`;
  }
  return `<div class="hgrid">${cells}</div>`;
}

// 今天頁：這天要做的
function renderTodayChecks() {
  const box = $('#todayChecks');
  if (!state.habits) { box.innerHTML = ''; return; }
  const date = state.date;
  const list = habitsOn(date);
  if (!list.length) {
    box.innerHTML = state.habits.some(h => h.active) ? '' : `<section class="card spread"><span class="sub">還沒有要追蹤的事</span><button class="btn small" id="goHabits">新增</button></section>`;
    if ($('#goHabits')) $('#goHabits').onclick = () => document.querySelector('[data-tab=habits]').click();
    return;
  }
  const n = list.filter(h => doneOn(h, date)).length;
  box.innerHTML = `<section class="card">
    <div class="spread" style="margin-bottom:10px"><h2 style="margin:0">${date === today() ? '今天' : '這天'}要做的</h2><span class="sub">${n} / ${list.length}</span></div>
    <div class="progress" style="margin-bottom:12px"><i style="width:${n / list.length * 100}%"></i></div>
    <div class="check-list">${list.map(h => `
      <button class="check ${doneOn(h, date) ? 'done' : ''}" data-id="${h.id}">
        <span class="box"></span>
        <span class="label">${esc(h.name)}</span>
        <span class="sub" style="margin-left:auto">${h.freq === 'weekly' ? `本週 ${weekCount(h, date)}/${h.times}` : h.freq === 'weekdays' ? freqLabel(h) : ''}</span>
      </button>`).join('')}</div>
  </section>`;
  box.querySelector('.check-list').onclick = ev => {
    const b = ev.target.closest('.check'); if (!b) return;
    toggleHabit(state.habits.find(h => h.id === b.dataset.id), date, renderTodayChecks);
  };
}

// 清單分頁
function renderHabits() {
  const v = $('#view');
  if (!state.habits) {
    v.innerHTML = pageHead('Habits', '清單') + '<div class="card empty">後端還沒更新，請先部署新版本</div>';
    return;
  }
  const active = state.habits.filter(h => h.active);
  const archived = state.habits.filter(h => !h.active);
  v.innerHTML = `
    ${pageHead('Habits', '清單', '<button class="btn outline small" id="newHabit">＋ 新增</button>')}
    ${active.length ? active.map(h => `
      <section class="card habit-card" data-id="${h.id}">
        <div class="spread"><div><b class="habit-name">${esc(h.name)}</b><div class="sub">${freqLabel(h)}</div></div>
          <button class="btn small ghost" data-edit>編輯</button></div>
        <div class="habit-stats">${habitStats(h)}</div>
        ${habitGrid(h)}
      </section>`).join('') : '<div class="card empty">還沒有要追蹤的事<br>按右上角「＋ 新增」開始</div>'}
    ${active.length ? '<p class="sub" style="text-align:center;margin:-4px 0 16px">點格子可以補打卡或取消</p>' : ''}
    ${archived.length ? `<details class="card"><summary>已封存（${archived.length}）</summary>${archived.map(h => `
      <div class="spread habit-card" data-id="${h.id}" style="padding:10px 0;border-top:1px solid var(--line)">
        <div><b>${esc(h.name)}</b><div class="sub">${freqLabel(h)}</div></div><button class="btn small ghost" data-edit>編輯</button></div>`).join('')}</details>` : ''}`;
  $('#newHabit').onclick = () => openHabitEditor();
  v.onclick = ev => {
    const card = ev.target.closest('.habit-card'); if (!card) return;
    const h = state.habits.find(x => x.id === card.dataset.id);
    if (ev.target.closest('[data-edit]')) return openHabitEditor(h);
    const cell = ev.target.closest('.hgrid i[data-d]');
    if (cell) toggleHabit(h, cell.dataset.d, renderHabits);
  };
}

function openHabitEditor(habit) {
  const isNew = !habit;
  const h = habit ? { ...habit, days: [...habit.days] } : { name: '', freq: 'daily', days: [1], times: 3, start: today(), active: true };
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  document.body.appendChild(bg);
  const draw = () => {
    bg.innerHTML = `<div class="sheet stack">
      <div class="spread"><h2 style="margin:0">${isNew ? '新增' : '編輯'}</h2><button class="icon-btn" data-close aria-label="關閉">✕</button></div>
      <div><label class="field">要做的事</label><input type="text" id="hName" value="${esc(h.name)}" placeholder="例如：運動 30 分鐘"></div>
      <div><label class="field">頻率</label>
        <div class="seg" id="hFreq" style="margin:0">
          <button data-f="daily" class="${h.freq === 'daily' ? 'on' : ''}">每天</button>
          <button data-f="weekdays" class="${h.freq === 'weekdays' ? 'on' : ''}">固定星期</button>
          <button data-f="weekly" class="${h.freq === 'weekly' ? 'on' : ''}">每週幾次</button>
        </div></div>
      ${h.freq === 'weekdays' ? `<div><label class="field">每週的哪幾天</label><div class="chips" id="hDays">${WD_MON.map(x => `
        <button class="chip ${h.days.includes(x) ? 'on' : ''}" data-x="${x}">${WD[x]}</button>`).join('')}</div></div>` : ''}
      ${h.freq === 'weekly' ? `<div><label class="field">每週幾次（哪天做都可以）</label>
        <div class="row"><button class="btn ghost" id="tMinus">−</button><b style="min-width:3em;text-align:center">${h.times} 次</b><button class="btn ghost" id="tPlus">＋</button></div></div>` : ''}
      <div><label class="field">從哪天開始</label><input type="date" id="hStart" value="${h.start}"></div>
      <div class="row" style="padding-top:8px">
        ${isNew ? '' : `<button class="btn ghost" id="hArchive">${h.active ? '封存' : '恢復'}</button><button class="btn danger" id="hDelete">刪除</button>`}
        <button class="btn primary" id="hSave" style="flex:1">儲存</button>
      </div>
    </div>`;
    const keep = () => { h.name = bg.querySelector('#hName').value; h.start = bg.querySelector('#hStart').value; };
    bg.querySelector('#hFreq').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { keep(); h.freq = b.dataset.f; draw(); } };
    if (bg.querySelector('#hDays')) bg.querySelector('#hDays').onclick = e => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      keep(); const x = Number(b.dataset.x);
      h.days = h.days.includes(x) ? h.days.filter(y => y !== x) : [...h.days, x]; draw();
    };
    if (bg.querySelector('#tMinus')) {
      bg.querySelector('#tMinus').onclick = () => { keep(); h.times = Math.max(1, h.times - 1); draw(); };
      bg.querySelector('#tPlus').onclick = () => { keep(); h.times = Math.min(7, h.times + 1); draw(); };
    }
    const save = (btn, patch) => busy(btn, async () => {
      keep();
      const out = { ...h, ...patch, name: h.name.trim() };
      if (!out.name) return toast('請輸入要做的事');
      if (out.freq === 'weekdays' && !out.days.length) return toast('請至少選一天');
      if (!out.start) return toast('請選開始日');
      state.habits = await api('saveHabit', { habit: out });
      toast('已儲存 ✓'); bg.remove(); render();
    });
    bg.querySelector('#hSave').onclick = e => save(e.currentTarget, {});
    if (!isNew) {
      bg.querySelector('#hArchive').onclick = e => save(e.currentTarget, { active: !h.active });
      bg.querySelector('#hDelete').onclick = e => {
        if (!confirm(`確定要刪除「${h.name}」嗎？它的打卡紀錄也會一起刪除。只是暫時不做的話，可以用「封存」。`)) return;
        busy(e.currentTarget, async () => {
          state.habits = await api('deleteHabit', { id: h.id });
          delete state.habitChecks[h.id];
          toast('已刪除'); bg.remove(); render();
        });
      };
    }
  };
  bg.onclick = e => { if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); };
  draw();
}

    sec.querySelector('[data-save]').onclick = e => busy(e.currentTarget, async () => {
      const text = box.value.trim();
      if (!text) return toast('不能是空的，要回到原本的請按「恢復預設」');
      state.prompt = await api('savePrompt', { kind: p.kind, prompt: text });
      toast('已儲存 ✓');
    });
    sec.querySelector('[data-reset]').onclick = e => {
      if (!confirm('確定要恢復成原本的寫法嗎？你改過的內容會不見。')) return;
      busy(e.currentTarget, async () => {
        state.prompt = await api('savePrompt', { kind: p.kind, prompt: '' });
        box.value = state.prompt[p.key];
        toast('已恢復預設 ✓');
      });
    };
  });
  $('#logoutBtn').onclick = () => { if (confirm('確定要登出嗎？')) logout(); };
}

// ───────── 開始 ─────────
applyPalette(store.get('palette', 'sage'));
if (state.password) start(); else logout();
</script>
</body>
</html>
